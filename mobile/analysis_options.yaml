# Lint aplikasi mobile: flutter_lints ditambah beberapa aturan supaya kode konsisten (flutter analyze di CI).
include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 120

analyzer:
  # Kode hasil swagger_parser dan build_runner tidak diubah manual.
  exclude:
    - lib/api/generated/**
    - build/**
    - android/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - unawaited_futures
    - use_build_context_synchronously
